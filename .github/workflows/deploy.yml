name: Deploy Jatahku

on:
  push:
    branches: [main]

# Antrean deploy: satu deploy dalam satu waktu. Dua push ke main yang berdekatan
# (mis. dua session merge bersamaan) tidak menjalankan deploy.sh bersamaan di VPS
# — git pull & npm run build yang tumpang tindih bisa merusak build frontend.
# Run baru MENUNGGU yang sedang berjalan (tidak membatalkannya). GitHub hanya
# menyimpan satu run yang menunggu per grup: run menunggu yang lebih lama
# dibatalkan oleh yang lebih baru — aman, karena deploy.sh selalu menarik main
# terbaru (isinya sudah mencakup commit sebelumnya).
concurrency:
  group: deploy-jatahku-production
  cancel-in-progress: false

jobs:
  deploy-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: blog/package-lock.json

      - name: Build blog
        working-directory: blog
        run: npm ci && npm run build

      - name: SCP blog dist to /tmp on VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: "blog/dist/"
          target: "/tmp/blog-dist-new/"
          strip_components: 2

  deploy-backend:
    runs-on: ubuntu-latest
    needs: deploy-blog
    permissions:
      contents: read
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            sudo git -C /opt/jatahku/app reset --hard HEAD
            sudo /opt/jatahku/deploy.sh

      - name: Verifikasi versi yang tayang
        # Lulus hanya bila API (/health) dan web (version.json) yang diakses publik
        # menjalankan commit ini — atau commit yang lebih baru bila push lain
        # menyusul. Dulu cukup HTTP 200, sehingga proses API lama yang masih
        # hidup pun dianggap sukses.
        env:
          EXPECTED: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          field() { python3 -c "import sys,json;print(json.load(sys.stdin).get('$1',''))" 2>/dev/null || true; }
          has_commit() {
            [ "$1" = "$EXPECTED" ] && return 0
            case "$1" in ''|unknown) return 1;; esac
            [ "$(gh api "repos/$REPO/compare/$EXPECTED...$1" --jq .status 2>/dev/null)" = "ahead" ]
          }
          ok_api=""; ok_web=""
          sleep 10
          for i in $(seq 1 12); do
            t=$(date +%s)
            if [ -z "$ok_api" ]; then
              body=$(curl -s --max-time 10 -H 'Cache-Control: no-cache' "https://api.jatahku.com/health?t=$t" || true)
              status=$(printf '%s' "$body" | field status)
              commit=$(printf '%s' "$body" | field commit)
              echo "API #$i: status=${status:-?} commit=${commit:-?}"
              if [ "$status" = "healthy" ] && has_commit "$commit"; then ok_api=1; fi
            fi
            if [ -z "$ok_web" ]; then
              web=$(curl -s --max-time 10 -H 'Cache-Control: no-cache' "https://jatahku.com/version.json?t=$t" || true)
              wcommit=$(printf '%s' "$web" | field commit)
              echo "Web #$i: commit=${wcommit:-?}"
              if has_commit "$wcommit"; then ok_web=1; fi
            fi
            if [ -n "$ok_api" ] && [ -n "$ok_web" ]; then
              echo "✅ API & web menjalankan ${EXPECTED:0:7} (atau lebih baru)"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Versi tayang tidak sesuai ${EXPECTED:0:7} — api: ${ok_api:-BELUM}, web: ${ok_web:-BELUM} (1 = ok)"
          exit 1

      - name: Notify Telegram on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Lewat env, bukan disisipkan ke skrip: pesan commit berisi tanda kutip
          # dulu merusak JSON (notifikasi gagal terkirim) dan bisa menyisipkan perintah.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT=$(printf '❌ Deploy Jatahku GAGAL\n\nCommit: %s\nPesan: %s\n\nDetail: %s' "$GITHUB_SHA" "$COMMIT_MSG" "$RUN_URL")
          jq -n --arg chat_id "$CHAT_ID" --arg text "$TEXT" '{chat_id: $chat_id, text: $text}' \
            | curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -H "Content-Type: application/json" -d @-

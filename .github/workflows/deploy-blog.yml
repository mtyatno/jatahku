name: Deploy Blog

on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - '.github/workflows/deploy-blog.yml'

# Antrean: satu deploy blog dalam satu waktu; run baru menunggu. Grupnya sengaja
# BERBEDA dari "Deploy Jatahku": GitHub hanya menyimpan satu run yang menunggu per
# grup, jadi grup bersama bisa membatalkan deploy aplikasi yang sedang menunggu
# demi deploy blog.
concurrency:
  group: deploy-blog-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: blog/package-lock.json

      - name: Install dependencies
        run: cd blog && npm ci

      - name: Build blog
        run: cd blog && npm run build

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: "blog/dist/*"
          target: "/home/jatahku/web/blog.jatahku.com/public_html"
          strip_components: 2

name: Migrasi

# Cek migrasi Alembic di PostgreSQL untuk PR yang menyentuh model atau migrasi.
# Skema awal meniru produksi (create_all dari model cabang dasar + stamp), lalu
# migrasi PR dinaikkan, dicocokkan dengan model (alembic check), diturunkan ke
# head dasar, dan dinaikkan lagi. Tidak men-deploy apa pun.
# Lihat .github/scripts/cek-migrasi.sh dan docs/plugin/03-workflow.md (Cara kerja).
on:
  pull_request:
    paths:
      - 'alembic/**'
      - 'alembic.ini'
      - 'app/models/**'
      - 'app/core/database.py'
      - 'requirements.txt'
      - '.github/scripts/cek-migrasi.sh'
      - '.github/workflows/migrasi.yml'

concurrency:
  group: migrasi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Ambil commit dasar
        run: git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-test.txt
      - name: Pasang dependensi
        run: pip install -r requirements-test.txt psycopg2-binary==2.9.10
      - name: Cek migrasi
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          JWT_SECRET: test-secret
        run: .github/scripts/cek-migrasi.sh "${{ github.event.pull_request.base.sha }}"

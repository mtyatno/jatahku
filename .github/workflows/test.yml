name: Tes

# Jalan di setiap PR dan setiap push ke main. Tidak men-deploy apa pun:
# deploy tetap di deploy.yml. Lihat docs/ai-advisor/03-workflow.md §5.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-test.txt
      - name: Pasang dependensi
        run: pip install -r requirements-test.txt
      - name: Unittest
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          JWT_SECRET: test-secret
        run: python -m unittest discover -s app/tests -t .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: node --test
        run: node --test src/lib/*.test.js src/native/*.test.js
      - name: Build
        run: npm run build

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A4F3E"/>
      <stop offset="100%" stop-color="#116653"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="100" r="260" fill="rgba(255,255,255,0.04)"/>
  <circle cx="150" cy="530" r="180" fill="rgba(255,255,255,0.03)"/>

  <!-- White card -->
  <rect x="580" y="80" width="560" height="470" rx="36" fill="rgba(255,255,255,0.09)"/>

  <!-- Clock face -->
  <circle cx="860" cy="265" r="135" fill="none" stroke="white" stroke-width="7"/>
  <!-- Clock ticks -->
  <line x1="860" y1="138" x2="860" y2="156" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="860" y1="374" x2="860" y2="392" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="733" y1="265" x2="751" y2="265" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="969" y1="265" x2="987" y2="265" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Hour hand -->
  <line x1="860" y1="265" x2="860" y2="180" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="860" y1="265" x2="923" y2="265" stroke="#4ADE80" stroke-width="5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="860" cy="265" r="10" fill="white"/>


  <rect x="705" y="440" width="310" height="54" rx="27" fill="rgba(255,255,255,0.92)"/>
  <circle cx="742" cy="467" r="15" fill="#1D9E75"/>
  <path d="M734 467 L740 473 L751 461" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="878" y="474" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#0F6E56">Langsung tercatat</text>

  <!-- Left content -->
  <rect x="60" y="60" width="215" height="38" rx="19" fill="rgba(255,255,255,0.15)"/>
  <text x="167.5" y="84" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="white" letter-spacing="1.5">TIPS KEUANGAN</text>

  <text x="60" y="200" font-family="Georgia,serif" font-size="52" font-weight="700" fill="white">Tidak Lagi</text>
  <text x="60" y="265" font-family="Georgia,serif" font-size="52" font-weight="700" fill="white">Ditahan</text>
  <text x="60" y="330" font-family="Georgia,serif" font-size="52" font-weight="700" fill="white">24 Jam</text>
  <text x="60" y="405" font-family="system-ui,sans-serif" font-size="21" fill="rgba(255,255,255,0.6)">Jeda sebelum checkout, bukan</text>
  <text x="60" y="435" font-family="system-ui,sans-serif" font-size="21" fill="rgba(255,255,255,0.6)">sesudah kamu membayar</text>

  <text x="60" y="580" font-family="Georgia,serif" font-size="26" font-weight="700" fill="rgba(255,255,255,0.85)">Jatahku</text>
  <text x="170" y="580" font-family="system-ui,sans-serif" font-size="17" fill="rgba(255,255,255,0.45)">jatahku.com</text>
